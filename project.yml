name: NewDocuments
options:
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    DEVELOPMENT_TEAM: 878WRHSR2X
    CODE_SIGN_STYLE: Automatic
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "11"
    NEW_DOCUMENTS_APP_GROUP: group.com.cobraprojects.newdocuments
    ENABLE_HARDENED_RUNTIME: YES
targets:
  NewDocuments:
    type: application
    platform: macOS
    sources:
      - path: src/main.swift
      - path: src/FileTypes.swift
      - path: src/DocumentTemplates.swift
      - path: src/FileTypesView.swift
      - path: src/PrivacyInfo.xcprivacy
      - path: assets/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: New Documents
        PRODUCT_BUNDLE_IDENTIFIER: com.cobraprojects.newdocuments
        INFOPLIST_FILE: src/NewDocuments-Info.plist
        CODE_SIGN_ENTITLEMENTS: src/app.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NewDocumentsExtension
        embed: true
  NewDocumentsExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: src/FinderExtension.swift
      - path: src/FileTypes.swift
      - path: src/DocumentTemplates.swift
      - path: src/MenuIcon.swift
      - path: src/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobraprojects.newdocuments.FinderExtension
        INFOPLIST_FILE: src/NewDocumentsExtension-Info.plist
        CODE_SIGN_ENTITLEMENTS: src/extension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  NewDocuments:
    build:
      targets:
        NewDocuments: all
    run:
      config: Debug
    archive:
      config: Release
